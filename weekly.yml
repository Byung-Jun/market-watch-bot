name: Weekly Market Watch

on:
  schedule:
    # 매주 일요일 13:00 UTC = 한국시간 일요일 밤 22:00
    - cron: "0 13 * * 0"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write  # 리포트 커밋용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 의존성(핀 포함)은 requirements.txt에서 관리 — 워크플로우 파일을
          # 건드리지 않고도 버전 핀을 갱신할 수 있음 (workflow 스코프 불필요).
          pip install -r requirements.txt

      - name: Run watchlist
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_watchlist.py

      # premium-content 파이프라인이 reports/를 읽어간다 (repo가 리포트 저장소 역할)
      - name: Commit reports
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "리포트: $(date -u +%F)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 주간 워치리스트 실행 실패. GitHub Actions 로그를 확인하세요."
